name: Build and Upload to Buildbot

on:
  push:
    tags:
      - "v*"   # Only run when pushing tags that start with 'v'

permissions:
  actions: read   # Required to list artifacts via the API

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HydraHookManager
          path: src/HydraHookManager/bin/Release/net10.0-windows/

      - name: Get artifact metadata
        id: get_artifact
        shell: bash
        run: |
          # Get artifacts for this run (artifacts may take a moment to appear)
          response=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)
          http_code=$(echo "$response" | tail -n1)
          response=$(echo "$response" | sed '$d')

          if [ "$http_code" != "200" ]; then
            echo "API returned HTTP $http_code: $response"
            exit 1
          fi

          # Use // [] to handle null artifacts (e.g. API error response)
          artifact_name=$(echo "$response" | jq -r '(.artifacts // [])[0].name')
          artifact_url=$(echo "$response" | jq -r '(.artifacts // [])[0].archive_download_url')

          if [ "$artifact_name" = "null" ] || [ -z "$artifact_url" ] || [ "$artifact_url" = "null" ]; then
            echo "No artifacts found. Response: $response"
            exit 1
          fi

          echo "file=$artifact_name.zip" >> $GITHUB_OUTPUT
          echo "url=$artifact_url" >> $GITHUB_OUTPUT

      - name: Send webhook
        shell: bash
        run: |
          payload=$(jq -n \
            --arg fileName "${{ steps.get_artifact.outputs.file }}" \
            --arg url "${{ steps.get_artifact.outputs.url }}" \
            --arg projectName "${{ github.event.repository.name }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg buildVersion "${{ github.ref_name }}" \
            '{
              artifacts: [
                {
                  fileName: $fileName,
                  url: $url
                }
              ],
              environmentVariables: {
                appveyor_project_name: $projectName,
                appveyor_repo_branch: $branch,
                appveyor_build_version: $buildVersion
              }
            }')

          curl -X POST "${{ secrets.WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Token: ${{ secrets.GITHUB_TOKEN }}" \
            -d "$payload"