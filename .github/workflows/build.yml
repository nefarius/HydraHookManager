name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Tag pushes are never cancelled so a release is never half-published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  security:
    name: Secret and code scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$tmp/gitleaks.tgz"
          echo "${GITLEAKS_SHA256}  $tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$tmp/gitleaks.tgz" -C "$tmp" gitleaks
          sudo install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks detect --source . --verbose --redact --exit-code 1
          gitleaks dir . --verbose --redact --exit-code 1

      - name: Semgrep
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0 semgrep scan --config p/csharp --error --metrics=off /src

  build:
    name: Build, test, publish
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (dotnet minver --tag-prefix v | Select-Object -Last 1).Trim()
          if (-not $version) { throw 'MinVer returned no version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Output "Version: $version"

      - name: Restore
        run: dotnet restore HydraHookManager.slnx

      - name: Build
        run: dotnet build HydraHookManager.slnx -c Release --no-restore

      - name: Test
        run: dotnet test HydraHookManager.slnx -c Release --no-build --verbosity normal

      - name: Vulnerability scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          foreach ($proj in (Get-ChildItem -Path src, tests -Recurse -Filter *.csproj)) {
            Write-Output "Scanning $($proj.FullName)"
            $out = dotnet list $proj.FullName package --vulnerable --include-transitive 2>&1 | Out-String
            Write-Output $out
            if ($out -match 'has the following vulnerable packages') {
              Write-Output "::error::Vulnerable packages in $($proj.Name)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Publish
        run: dotnet publish src/HydraHookManager/HydraHookManager.csproj -c Release -r win-x64 --no-self-contained -o artifacts/publish

      - name: Verify publish payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'artifacts\publish\HydraHookManager.exe'
            'artifacts\publish\HydraHookManager.dll'
            'artifacts\publish\Injector\x86\Injector.exe'
            'artifacts\publish\Injector\x64\Injector.exe'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "File not found in publish output: $file" }
          }
          foreach ($file in $files[2..3]) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne 'Valid') { throw "Bundled $file is not validly signed (Status=$($sig.Status))." }
          }

      - name: Upload publish artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hydrahookmanager-publish
          path: artifacts/publish
          if-no-files-found: error
          retention-days: 3

  sign-and-package:
    name: Sign and package
    needs: [security, build]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      SIGN_RELAY_SERVER: ${{ vars.SIGN_RELAY_SERVER || 'https://signrelay.api.nefarius.systems/' }}
      SIGN_RELAY_CI_TOKEN: ${{ secrets.SIGN_RELAY_CI_TOKEN }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
    steps:
      - name: Require signing configuration
        shell: pwsh
        run: |
          if (-not $env:SIGN_RELAY_SERVER) { throw 'SIGN_RELAY_SERVER is empty.' }
          if (-not $env:SIGN_RELAY_CI_TOKEN) { throw 'Repository secret SIGN_RELAY_CI_TOKEN is not set.' }
          Write-Output "SignRelay server: $env:SIGN_RELAY_SERVER"

      # persist-credentials is false, so the check goes through the API.
      # "ahead" means master contains the tag; "identical" means the tag is master's tip.
      - name: Require tagged commit on master
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...master" --jq .status)"
          case "$status" in
            identical|ahead) ;;
            *)
              echo "::error::Tagged commit ${GITHUB_SHA} is not on master (compare status: ${status})"
              exit 1
              ;;
          esac

      - name: Validate tag version
        shell: pwsh
        env:
          EXPECTED: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$') {
            throw "Tag '$env:GITHUB_REF_NAME' is not a vMAJOR.MINOR.PATCH[-prerelease] version."
          }
          if ($version -ne $env:EXPECTED) {
            throw "Tag version '$version' does not match MinVer version '$env:EXPECTED'."
          }

      - name: Download publish artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hydrahookmanager-publish
          path: publish

      - name: Assert app binaries are unsigned
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('publish\HydraHookManager.exe', 'publish\HydraHookManager.dll')) {
            if (-not (Test-Path -LiteralPath $file)) { throw "File not found: $file" }
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne 'NotSigned') {
              throw "Expected unsigned $file but Get-AuthenticodeSignature returned $($sig.Status)."
            }
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The bundled Injector.exe files are third-party and already signed; they are not re-signed.
      - name: Sign app binaries
        uses: nefarius/SignRelay@31a8d34f0d7da6e44e9c4a794b0f51e0f5f2e8fd
        with:
          server: ${{ env.SIGN_RELAY_SERVER }}
          token: ${{ env.SIGN_RELAY_CI_TOKEN }}
          in-place: true
          files: |
            publish/HydraHookManager.exe
            publish/HydraHookManager.dll

      - name: Verify signed binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'publish\HydraHookManager.exe'
            'publish\HydraHookManager.dll'
            'publish\Injector\x86\Injector.exe'
            'publish\Injector\x64\Injector.exe'
          )
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne 'Valid' -or -not $sig.SignerCertificate) {
              throw "File is not validly signed: $file (Status=$($sig.Status))."
            }
            Write-Output "Signed: $file (Subject=$($sig.SignerCertificate.Subject))"
          }

      - name: Package release archive and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $zip = "release\HydraHookManager-$env:GITHUB_REF_NAME-win-x64.zip"
          $items = Get-ChildItem -Path publish -Force | Where-Object { $_.Extension -ne '.pdb' }
          Compress-Archive -Path $items.FullName -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = "$hash  $(Split-Path $zip -Leaf)`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD 'release\checksums.txt'), $line, [System.Text.UTF8Encoding]::new($false))
          Get-Content release\checksums.txt

      - name: Verify archive contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:RUNNER_TEMP 'release-verify'
          Expand-Archive -LiteralPath (Get-ChildItem release\*.zip).FullName -DestinationPath $staging -Force
          foreach ($file in @('HydraHookManager.exe', 'HydraHookManager.dll', 'Injector\x86\Injector.exe', 'Injector\x64\Injector.exe')) {
            $path = Join-Path $staging $file
            if (-not (Test-Path -LiteralPath $path)) { throw "Archive is missing $file" }
            $sig = Get-AuthenticodeSignature -LiteralPath $path
            if ($sig.Status -ne 'Valid') { throw "Archive file $file is not validly signed (Status=$($sig.Status))." }
          }

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.repository.name }}-release
          path: release/*
          if-no-files-found: error

      - name: Mirror to Buildbot
        if: ${{ env.WEBHOOK_URL != '' }}
        uses: nefarius/AppVeyorArtifactsReceiver@35ce2f75ea464aec25c8e17b30d607b310942fe7
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: ${{ github.event.repository.name }}-release

  release:
    name: Publish GitHub Release
    needs: sign-and-package
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ github.event.repository.name }}-release
          path: release

      - name: Return an existing release to draft before replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          lookup_err=$(mktemp)
          set +e
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>"$lookup_err")
          status=$?
          set -e
          message=$(tr -d '\r\n' < "$lookup_err")
          if [ "$status" -eq 0 ]; then
            if [ "$draft" = "false" ]; then
              echo "Returning published release $RELEASE_TAG to draft before replacing its assets"
              gh release edit "$RELEASE_TAG" --draft
            fi
          elif [ "$status" -eq 1 ] && [ "$message" = "release not found" ]; then
            echo "No existing release for $RELEASE_TAG; the publish step will create one"
          else
            echo "Release lookup failed with exit ${status}" >&2
            cat "$lookup_err" >&2
            exit "$status"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release/HydraHookManager-*-win-x64.zip
            release/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: true

      - name: Undraft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A prerelease must stay off releases/latest, which the in-app update check reads.
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
